; XNFSMusicPlayer Configuration with Spotify Integration
; This is an example configuration showing how to enable Spotify

[Installer]
InstallerCompleted=1
InstallerMusic=1
InstallMusicFile=scripts\XNFSMusicPlayer\install.ogg

[XNFSMusicPlayer]
LogFileEnabled=1
LogFilePath=scripts\XNFSMusicPlayer\XNFSMusicPlayer.log
GlobalVolume=10000
SampleRate=44100
InputBufferSize=500
DeviceBufferSize=-1
UseAsyncRead=1
AsyncBufferSize=262144
SlowHashing=0
VerbosityLevel=1

[Playback]
GameVolumeControl=1
EnableInteractiveNoding=1
GlobalTrackerAmp=50.0
VolumeMultiplier=100.0
FadeoutTime=5000
TrackSwitchHotkey=179

[GameThread]
UseGameThread=0
UpdateLength=500

[Threading]
NumOfThreads=0
UpdatePeriod=0

[Playlists]
PlaylistFile=scripts\XNFSMusicPlayer\Playlist.m3u
PlaylistConfigFile=scripts\XNFSMusicPlayer\PlaylistConfig.ini
OverridePathConfigFile=scripts\XNFSMusicPlayer\Overrides.txt

; ============ SPOTIFY INTEGRATION ============
; Set EnableSpotify to 1 to use Spotify, 0 to use local MP3s
[Spotify]
EnableSpotify=1
