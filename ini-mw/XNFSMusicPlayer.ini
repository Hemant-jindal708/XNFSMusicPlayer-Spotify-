[XNFSMusicPlayer]
GlobalVolume = 10000
SampleRate = 44100
InputBufferSize = 500
DeviceBufferSize = -1
UseAsyncRead = 1
AsyncBufferSize = 262144
SlowHashing = 0
VerbosityLevel = 3
LogFileEnabled = 1
LogFilePath = scripts\XNFSMusicPlayer\XNFSMusicPlayer.log
